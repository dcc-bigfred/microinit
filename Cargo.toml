[package]
name = "microinit"
version = "0.1.0"
edition = "2021"
description = "PID 1 init system and service supervisor for BigFred OS"
license = "MIT"
authors = ["BigFred"]
readme = "README.md"

[lib]
name = "microinit"
path = "src/lib.rs"

[[bin]]
name = "microinit"
path = "src/main.rs"

[[bin]]
name = "shutdown"
path = "src/bin/shutdown.rs"

[features]
# OpenTelemetry (OTLP) and full PID-1 init are on by default.
# Android / supervise-only builds: `--no-default-features`.
default = ["otel", "init"]
# OTel export; HTTP client (ureq) is always available for livenessProbe.httpUrl.
otel = []
# Full PID-1 init: early-boot, getty, TTY attach, unmount, reboot(2).
# Off for Android (supervise-only) builds.
init = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = [
    "process",
    "signal",
    "mount",
    "reboot",
    "fs",
    "user",
    "socket",
] }
thiserror = "2"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8.2.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.release-assertions]
inherits = "release"
debug-assertions = true
overflow-checks = true

[dev-dependencies]
serial_test = "3"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
