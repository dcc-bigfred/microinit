name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (no otel, with init)
        run: cargo clippy --all-targets --no-default-features --features init -- -D warnings

      - name: Clippy (supervise-only)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test (no otel, with init)
        run: cargo test --locked --no-default-features --features init

      - name: Test (supervise-only)
        run: cargo test --locked --no-default-features

      - name: Test (release-assertions)
        run: cargo test --locked --profile release-assertions

  build:
    name: Build musl (${{ matrix.name }})
    needs: test
    # Native runners + apt musl-tools (no musl.cc download).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            dist_name: microinit-linux-arm64
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
            cc_env: CC_aarch64_unknown_linux_musl
            ar_env: AR_aarch64_unknown_linux_musl
          - name: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            dist_name: microinit-linux-amd64
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
            cc_env: CC_x86_64_unknown_linux_musl
            ar_env: AR_x86_64_unknown_linux_musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}-musl

      - name: Install musl toolchain (apt)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          musl-gcc --version

      - name: Build static binary + package dist
        run: |
          set -euo pipefail
          export ${{ matrix.linker_env }}=musl-gcc
          export ${{ matrix.cc_env }}=musl-gcc
          export ${{ matrix.ar_env }}=ar
          export RUSTFLAGS='-C target-feature=+crt-static'

          cargo build --release --target ${{ matrix.rust_target }}

          mkdir -p dist
          cp -f "target/${{ matrix.rust_target }}/release/microinit" "dist/${{ matrix.dist_name }}"
          chmod 755 "dist/${{ matrix.dist_name }}"

          SHUTDOWN_DIST="shutdown-linux-${{ matrix.name }}"
          cp -f "target/${{ matrix.rust_target }}/release/shutdown" "dist/${SHUTDOWN_DIST}"
          chmod 755 "dist/${SHUTDOWN_DIST}"

          if [ "${{ matrix.name }}" = "arm64" ]; then
            cp -f scripts/early-boot.sh dist/early-boot.sh
            chmod 755 dist/early-boot.sh
            cp -f scripts/unmount.sh dist/unmount.sh
            chmod 755 dist/unmount.sh
            make man
            mkdir -p dist/man/man5 dist/man/man8
            cp -f man/man5/*.gz dist/man/man5/
            cp -f man/man8/*.gz dist/man/man8/
            (
              cd dist
              sha256sum microinit-linux-arm64 shutdown-linux-arm64 early-boot.sh unmount.sh \
                man/man5/*.gz man/man8/*.gz > SHA256SUMS
            )
          fi

          for f in "dist/${{ matrix.dist_name }}" "dist/${SHUTDOWN_DIST}"; do
            file "$f"
            if ldd "$f" 2>&1 | grep -qi 'not a dynamic\|statically linked'; then
              echo "static binary OK: $f"
            else
              echo "warning: ldd output for $f:" >&2
              ldd "$f" >&2 || true
            fi
            ls -lh "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-oci:
    name: Publish OCI artifact to GHCR (ORAS)
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-arm64
          path: dist/

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish microinit-linux-arm64
        run: ./scripts/publish-oci-microinit.sh dist/microinit-linux-arm64 dist/early-boot.sh dist/unmount.sh dist/shutdown-linux-arm64

      - name: Job summary
        run: |
          {
            echo "### OCI publish (ORAS)"
            echo ""
            echo "- Image: \`ghcr.io/dcc-bigfred/microinit-linux-arm64\`"
            echo "- Tags: \`main\`, \`sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            arch: arm64
          - name: armv7
            arch: armv7
          - name: x86_64
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.name }}

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: false

      - name: Build Android binaries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_API: "24"
        run: ./scripts/build-android.sh ${{ matrix.arch }}

      - name: Verify Bionic linkage
        run: |
          set -euo pipefail
          for f in dist/libmicroinit.so dist/libshutdown.so dist/microinit-android-* dist/shutdown-android-*; do
            [ -f "$f" ] || continue
            file "$f"
            if ! file "$f" | grep -qi 'android\|linker64\|linker'; then
              echo "error: expected Android/Bionic binary: $f" >&2
              file "$f" >&2
              exit 1
            fi
            # Must not be a glibc dynamic binary.
            if readelf -l "$f" 2>/dev/null | grep -q 'Requesting program interpreter: /lib/ld-linux'; then
              echo "error: glibc-linked binary (want Bionic): $f" >&2
              exit 1
            fi
            ls -lh "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-android-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-oci-android:
    name: Publish Android OCI artifact to GHCR (ORAS)
    needs: build-android
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android arm64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-android-arm64
          path: dist/

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish microinit-android-arm64
        run: |
          set -euo pipefail
          microinit=dist/libmicroinit.so
          shutdown=dist/libshutdown.so
          [[ -f "${microinit}" ]] || microinit=dist/microinit-android-arm64
          [[ -f "${shutdown}" ]] || shutdown=dist/shutdown-android-arm64
          ./scripts/publish-oci-microinit-android.sh "${microinit}" "${shutdown}"

      - name: Job summary
        run: |
          {
            echo "### Android OCI publish (ORAS)"
            echo ""
            echo "- Image: \`ghcr.io/dcc-bigfred/microinit-android-arm64\`"
            echo "- Tags: \`main\`, \`sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-image:
    name: Publish distroless container image
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-arm64
          path: dist-arm64/

      - name: Download amd64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-amd64
          path: dist-amd64/

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp -f dist-arm64/microinit-linux-arm64 dist/
          cp -f dist-amd64/microinit-linux-amd64 dist/
          chmod 755 dist/microinit-linux-arm64 dist/microinit-linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multiarch image
        run: ./scripts/publish-oci-microinit-image.sh

      - name: Job summary
        run: |
          {
            echo "### Container image"
            echo ""
            echo "- Image: \`ghcr.io/dcc-bigfred/microinit\`"
            echo "- Tags: \`main\`, \`sha-${GITHUB_SHA::7}\`"
            echo "- Entrypoint: \`/microinit supervise\`"
          } >> "$GITHUB_STEP_SUMMARY"
