name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish GitHub release + OCI tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for CI build artifacts
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          DEADLINE=$(( $(date +%s) + 1800 ))
          RUN_ID=""

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUN_JSON="$(gh run list --workflow=ci.yml --commit="$SHA" --limit=1 --json databaseId,status,conclusion)"
            if [ "$RUN_JSON" = "[]" ]; then
              echo "CI workflow run for ${SHA} not found yet; retrying..."
              sleep 15
              continue
            fi

            STATUS="$(echo "$RUN_JSON" | jq -r '.[0].status')"
            CONCLUSION="$(echo "$RUN_JSON" | jq -r '.[0].conclusion')"
            RUN_ID="$(echo "$RUN_JSON" | jq -r '.[0].databaseId')"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "CI workflow run ${RUN_ID} finished with conclusion: ${CONCLUSION}"
                exit 1
              fi
              echo "CI workflow run ${RUN_ID} succeeded"
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "CI workflow run ${RUN_ID} status=${STATUS}; waiting..."
            sleep 15
          done

          echo "Timed out after 30 minutes waiting for CI workflow on commit ${SHA}"
          exit 1

      - name: Download CI binaries (linux arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ steps.ci.outputs.run_id }}" \
            --name binaries-arm64 \
            --dir release-assets

      - name: Download CI binaries (android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for arch in arm64 armv7 x86_64; do
            gh run download "${{ steps.ci.outputs.run_id }}" \
              --name "binaries-android-${arch}" \
              --dir "release-assets/android-${arch}"
            # Flatten into release-assets/ (avoid nested dirs in the release).
            find "release-assets/android-${arch}" -type f -exec cp -f {} release-assets/ \;
            rm -rf "release-assets/android-${arch}"
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install cross objcopy for ELF rewrite
        run: |
          set -euo pipefail
          sudo apt-get update
          # aarch64 (linux + android arm64) and arm (android armv7) on amd64 runner;
          # native objcopy covers x86_64. inject-elf-version prefers llvm-objcopy when present.
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf

      - name: Inject release version into ELF binaries
        env:
          GOPROXY: direct
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          INJECT="github.com/dcc-bigfred/common/cmd/inject-elf-version@latest"
          find release-assets -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -qi 'ELF'; then
              go run "${INJECT}" "$f" "$TAG" "$COMMIT" .microinit.version
            else
              echo "skip (not ELF): $f"
            fi
          done

      - name: Refresh SHA256SUMS after ELF inject
        run: |
          set -euo pipefail
          # CI ships SHA256SUMS for the arm64 linux artifact. ELF inject changes
          # those binaries, so the published checksums must be recomputed.
          sums=release-assets/SHA256SUMS
          if [ ! -f "${sums}" ]; then
            echo "no SHA256SUMS in release-assets; skipping refresh"
            exit 0
          fi
          (
            cd release-assets
            mapfile -t names < <(awk '{print $2}' SHA256SUMS)
            if [ "${#names[@]}" -eq 0 ]; then
              echo "error: SHA256SUMS is empty" >&2
              exit 1
            fi
            for n in "${names[@]}"; do
              if [ ! -f "${n}" ]; then
                echo "error: SHA256SUMS lists missing file: ${n}" >&2
                exit 1
              fi
            done
            sha256sum -- "${names[@]}" > SHA256SUMS.new
            mv -f SHA256SUMS.new SHA256SUMS
            echo "refreshed SHA256SUMS (${#names[@]} entries)"
            cat SHA256SUMS
          )

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          else
            echo "Release ${TAG} already exists"
          fi

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mapfile -d '' FILES < <(find release-assets -type f -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag distroless container image from main
        run: ./scripts/retag-oci-microinit-image.sh "${GITHUB_REF_NAME}"

      - name: Job summary
        run: |
          {
            echo "### Release ${GITHUB_REF_NAME}"
            echo ""
            echo "- GitHub Release assets uploaded (linux + android)"
            echo "- Image: \`ghcr.io/dcc-bigfred/microinit:${GITHUB_REF_NAME}\`"
            echo "- Image: \`ghcr.io/dcc-bigfred/microinit:latest-release\`"
          } >> "$GITHUB_STEP_SUMMARY"
